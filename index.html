<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>아이와 함께하는 일본 여행 일본어</title>
    <meta name="description" content="3세 아이와 함께하는 일본 여행을 위한 실전 일본어 학습 공간" />
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #342c27; background: linear-gradient(145deg, #fff8ee, #f6e3dc); }
      main { width: min(720px, 100%); padding: clamp(32px, 8vw, 72px); border: 1px solid rgba(94, 62, 49, .12); border-radius: 32px; background: rgba(255, 255, 255, .76); box-shadow: 0 24px 70px rgba(106, 67, 52, .12); }
      .eyebrow { margin: 0 0 14px; color: #c45d43; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
      h1 { margin: 0; font-size: clamp(38px, 7vw, 64px); line-height: 1.08; letter-spacing: -.055em; }
      p { margin: 24px 0 0; color: #725f55; font-size: clamp(17px, 2.6vw, 21px); line-height: 1.75; }
      .tag { display: inline-block; margin-top: 30px; padding: 9px 14px; border-radius: 999px; color: #8b4d3a; background: #fce3d8; font-size: 14px; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">FAMILY TRAVEL JAPANESE</p>
      <h1>아이와 함께하는<br />일본 여행 일본어</h1>
      <p>3세 아이와의 여행에서 실제로 마주치는 순간을 중심으로, 꼭 필요한 표현을 쉽고 편안하게 익히는 공간입니다.</p>
      <span class="tag">콘텐츠를 준비하고 있어요</span>
    </main>
  </body>
</html>
